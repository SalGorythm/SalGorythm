    stroke="url(#sg-grad)"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="22" cy="9.5" r="2" fill="#22d3ee" filter="url(#sg-blur)"/>
  <circle cx="22" cy="9.5" r="1.35" fill="#67e8f9"/>
